[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (Netlify Functions v2). github-stars proxies the repo
# star count so the browser never calls api.github.com directly (no visitor IP
# sent to a US third party). This is the default location, declared explicitly.
[functions]
  directory = "netlify/functions"

# Legacy workshop-only signup URLs — superseded by the shared
# announcements capture (one Netlify form serving workshops AND
# exhibitions). Old submissions remain in the dashboard under the
# retired "workshop-interest" form.
[[redirects]]
  from = "/workshops/signup"
  to = "/announce"
  status = 301

[[redirects]]
  from = "/workshops/thanks"
  to = "/announce/thanks"
  status = 301

# Security headers applied site-wide. CSP is intentionally deferred until
# fonts are self-hosted and inline-script hashes can be enumerated.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"

# Lesson media only — the previous "/lessons/*" glob also caught the lesson
# HTML pages, freezing them in browser caches for a year. Pages now fall back
# to Netlify's default (etag revalidation); immutable is reserved for assets.
[[headers]]
  for = "/lesson-media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fingerprinted build output — hashed JS, CSS, and bundled @fontsource fonts
# all emit to /_astro/ with content hashes in the filename, so they are safe to
# cache forever. (Replaces a stale "/fonts/*" rule: fonts are not served from
# /fonts/ — they bundle into /_astro/.)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
